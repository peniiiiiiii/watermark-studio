<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浮水印工作台</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="批次為照片加上設計過的浮水印。原尺寸無損輸出，全程在瀏覽器處理。">
<style>
  :root{
    --bg:#ffffff; --bg-sub:#f7f7f5; --bg-hover:#f1f1ef;
    --border:#e9e9e7; --border-strong:#dfdfdc;
    --text:#37352f; --text-2:#787774; --text-3:#9b9a97;
    --blue:#2383e2; --blue-dark:#1b72cb; --blue-soft:#e7f1fb;
    --green:#448361; --red:#c4554d;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
    --radius:5px;
    --bar-h:186px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit}
  :focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 40px}

  /* ---------- top ---------- */
  .topbar{padding:44px 0 0}
  h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 8px}
  .sub{color:var(--text-2);font-size:15px;margin:0 0 30px;max-width:62ch}
  .addBtn{display:none}

  .panel{border:1px solid var(--border);border-radius:6px;padding:20px 22px;margin-bottom:44px;position:sticky;top:0;background:var(--bg);z-index:20}

  /* ---------- controls (shared DOM, two layouts) ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start}
  .group{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start}
  .field{display:flex;flex-direction:column;gap:7px}
  .field > label{font-size:12px;font-weight:600;color:var(--text-2)}
  input[type=text]{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);padding:7px 10px;width:186px;transition:border-color .12s,box-shadow .12s}
  input[type=text]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
  input[type=text]::placeholder{color:var(--text-3)}

  .seg{display:inline-flex;background:var(--bg-hover);border-radius:6px;padding:2px;gap:2px}
  .seg button{appearance:none;background:transparent;border:0;border-radius:4px;color:var(--text-2);font-size:13px;font-weight:500;padding:7px 13px;cursor:pointer;transition:background .12s,color .12s,box-shadow .12s;white-space:nowrap}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed=true]{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(15,15,15,.1)}

  .grid9{display:grid;grid-template-columns:repeat(3,25px);grid-template-rows:repeat(3,25px);gap:3px}
  .grid9 button{appearance:none;background:var(--bg-hover);border:0;border-radius:3px;cursor:pointer;padding:0;position:relative;transition:background .12s}
  .grid9 button::after{content:"";position:absolute;inset:8px;border-radius:1px;background:var(--text-3);transition:background .12s}
  .grid9 button:hover{background:#e6e6e3}
  .grid9 button[aria-pressed=true]{background:var(--blue)}
  .grid9 button[aria-pressed=true]::after{background:#fff}

  .slider{display:flex;align-items:center;gap:10px;width:186px}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;flex:1;height:24px;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--border)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--border)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--border-strong);box-shadow:0 1px 3px rgba(15,15,15,.18);margin-top:-7px;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--border-strong);box-shadow:0 1px 3px rgba(15,15,15,.18);cursor:pointer}
  .val{font-size:12px;color:var(--text-3);width:38px;text-align:right;font-variant-numeric:tabular-nums}

  .btn{appearance:none;background:var(--bg);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--radius);font-size:14px;padding:7px 13px;cursor:pointer;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--bg-sub)}
  .btn.on{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
  .btn.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
  .btn.primary[disabled]{background:var(--bg-hover);border-color:var(--border);color:var(--text-3);cursor:not-allowed}
  .hint{font-size:12px;color:var(--text-3);margin:0;max-width:200px;line-height:1.5}
  .hint.bad{color:var(--red)}

  /* style chips (mobile) */
  .chips{display:none;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{appearance:none;flex:none;background:var(--bg-hover);border:0;border-radius:16px;color:var(--text-2);font-size:13.5px;padding:9px 15px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
  .chip[aria-pressed=true]{background:var(--blue);color:#fff}
  .chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-2)}

  /* ---------- sections ---------- */
  section{margin-bottom:52px}
  .sec-head h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
  .sec-head p{font-size:14px;color:var(--text-2);margin:2px 0 0}
  .divider{height:1px;background:var(--border);margin:16px 0 20px}

  .styles{display:grid;gap:18px 16px;grid-template-columns:repeat(auto-fill,minmax(222px,1fr))}
  .card{background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .12s,box-shadow .12s}
  .card:hover{border-color:var(--border-strong);box-shadow:0 2px 6px rgba(15,15,15,.06)}
  .card.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
  .stage{position:relative;background:var(--bg-sub);line-height:0}
  canvas{width:100%;height:auto;display:block}
  .check{position:absolute;right:9px;top:9px;width:21px;height:21px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;line-height:1;opacity:0;transform:scale(.7);transition:opacity .14s,transform .14s cubic-bezier(.2,1.4,.4,1);box-shadow:0 1px 3px rgba(15,15,15,.2)}
  .card.active .check{opacity:1;transform:scale(1)}
  .meta{padding:11px 13px 13px;border-top:1px solid var(--border)}
  .mrow{display:flex;align-items:center;gap:7px}
  .name{font-size:14px;font-weight:500;flex:1}
  .tag{font-size:11px;color:var(--text-3);background:var(--bg-sub);border-radius:3px;padding:2px 6px;flex:none}
  .note{font-size:12.5px;color:var(--text-2);line-height:1.5;margin:5px 0 0}

  .drop{border:1px dashed var(--border-strong);border-radius:6px;padding:34px 24px;text-align:center;background:var(--bg-sub);cursor:pointer;transition:background .12s,border-color .12s}
  .drop:hover,.drop.over{background:var(--bg-hover);border-color:var(--blue)}
  .drop strong{display:block;font-size:15px;font-weight:500;margin-bottom:4px}
  .drop span{font-size:13px;color:var(--text-2)}
  .batch{display:grid;gap:16px 14px;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));margin-top:18px}
  .item{background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
  .idesc{padding:9px 10px 2px}
  .iname{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idim{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .idim em{font-style:normal;color:var(--green)}
  .ibar{display:flex;align-items:center;gap:2px;padding:4px 6px 7px}
  .mini{appearance:none;background:transparent;border:0;border-radius:3px;color:var(--text-2);font-size:12px;padding:6px 8px;cursor:pointer;transition:background .12s,color .12s}
  .mini:hover{background:var(--bg-hover);color:var(--text)}
  .mini.x{margin-left:auto}
  .mini.x:hover{color:var(--red)}
  .mini.ok{color:var(--green)}
  .mini.save{color:var(--blue);font-weight:500}
  .vtag{position:absolute;left:8px;top:8px;background:rgba(55,53,47,.78);color:#fff;font-size:11px;padding:3px 6px;border-radius:3px}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--border);padding:11px 0 calc(11px + env(safe-area-inset-bottom))}
  .dock-inner{max-width:1080px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:12px}
  .count{font-size:13px;color:var(--text-2);white-space:nowrap}
  .count b{color:var(--text);font-weight:600}
  .spacer{flex:1}

  /* ---------- mobile bottom bar ---------- */
  .bottombar{display:none}
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,15,15,.42)}
  .modal.open{display:flex}
  .modal-card{background:var(--bg);border-radius:8px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:18px;box-shadow:0 12px 40px rgba(15,15,15,.24)}
  .modal-card h3{font-size:16px;font-weight:600;margin:0 0 4px}
  .modal-card p{font-size:13.5px;color:var(--text-2);margin:0 0 14px}
  .mimg{width:100%;height:auto;display:block;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-sub)}
  .mact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .mact a.btn{text-decoration:none;display:inline-block}

  @media (max-width:860px){
    .wrap{padding:0 14px}
    /* 頂列固定，上傳縮成右上角圖示 */
    .topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);
            padding:0;height:52px;display:flex;align-items:center;gap:10px}
    .topbar .wrapinner{max-width:none;padding:0 14px;display:flex;align-items:center;width:100%;gap:10px}
    h1{font-size:16px;font-weight:600;margin:0;flex:1;letter-spacing:0}
    .sub{display:none}
    .addBtn{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;
            background:var(--blue);color:#fff;border:0;font-size:20px;line-height:1;cursor:pointer;padding:0 0 2px}
    .panel{display:none}
    #styleSection{display:none}
    section{margin-bottom:0}
    .sec-head{display:none}
    .divider{display:none}
    main{padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom) + 12px)}
    .drop{margin-top:60px;padding:44px 20px;border-radius:10px}
    .batch{grid-template-columns:1fr;gap:20px;margin-top:16px}
    .item{border-radius:8px}
    .idesc{padding:10px 12px 2px}
    .iname{font-size:13.5px}
    .idim{font-size:12px}
    .ibar{padding:4px 8px 9px;gap:4px}
    .mini{font-size:13.5px;padding:9px 12px}
    .dock{display:none}

    .bottombar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
               border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(15,15,15,.06);
               padding-bottom:env(safe-area-inset-bottom)}
    .tabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--border);height:44px}
    .tabs button{appearance:none;background:transparent;border:0;color:var(--text-2);font-size:14px;
                 padding:0 12px;height:44px;cursor:pointer;position:relative}
    .tabs button[aria-selected=true]{color:var(--text);font-weight:600}
    .tabs button[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--blue);border-radius:1px}
    .tabs .flex{flex:1}
    .tabs .save-all{background:var(--blue);color:#fff;border-radius:15px;height:30px;padding:0 14px;font-size:13px;font-weight:500}
    .tabs .save-all[disabled]{background:var(--bg-hover);color:var(--text-3)}

    .panelbody{padding:12px 14px;height:calc(var(--bar-h) - 44px);overflow:hidden}
    .controls{display:block}
    .group{display:none;flex-direction:column;gap:12px}
    .group.show{display:flex}
    .field{width:100%;gap:6px}
    .field > label{font-size:12px}
    input[type=text]{width:100%;font-size:16px;padding:9px 11px}
    .seg{display:flex;width:100%}
    .seg button{flex:1;padding:9px 6px;font-size:13.5px}
    .slider{width:100%}
    .chips{display:flex}
    #styleGridWrap{display:none}
    .row{display:flex;gap:14px;align-items:center}
    .grid9{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:4px;flex:none}
    .grid9 button::after{inset:11px}
    .fmtField{display:none}
    .hint{max-width:none;font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar">
  <div class="wrap wrapinner">
    <h1>浮水印工作台</h1>
    <button class="addBtn" id="addBtn" aria-label="加入照片">＋</button>
  </div>
</header>

<div class="wrap">
  <p class="sub">上傳最多 10 張照片，選一種樣式，全部一起套用。</p>
  <div class="panel" id="panel"></div>

  <main>
    <section id="styleSection">
      <div class="sec-head"><h2>樣式</h2><p>點選一種，下方批次全部套用</p></div>
      <div class="divider"></div>
      <div class="styles" id="styleGrid"></div>
    </section>

    <section>
      <div class="sec-head"><h2>批次</h2><p id="batchHint">最多 10 張，輸出保留原始尺寸</p></div>
      <div class="divider"></div>
      <div class="drop" id="drop">
        <strong>拖曳照片到這裡，或點一下從圖庫選擇</strong>
        <span id="dropSub">JPG · PNG · WebP，影片可取單格</span>
      </div>
      <input type="file" id="batchInput" accept="image/*,video/*" multiple hidden>
      <div class="batch" id="batchGrid"></div>
    </section>
  </main>
</div>

<div class="modal" id="saveModal">
  <div class="modal-card">
    <h3>另存圖片</h3>
    <p>這是完整解析度的成品。長按圖片可存到相簿；電腦按右鍵另存新檔。</p>
    <img class="mimg" id="saveImg" alt="加上浮水印的成果">
    <div class="mact">
      <a class="btn primary" id="saveLink" download>試著直接下載</a>
      <button class="btn" id="saveClose">關閉</button>
    </div>
  </div>
</div>

<div class="dock">
  <div class="dock-inner">
    <div class="count">已上傳 <b id="count">0</b> / 10</div>
    <div class="spacer"></div>
    <button class="btn primary" id="zipBtn" disabled>打包下載 ZIP</button>
  </div>
</div>

<div class="bottombar" id="bottombar">
  <div class="tabs" id="tabs">
    <button data-tab="style" aria-selected="true">樣式</button>
    <button data-tab="text" aria-selected="false">文字</button>
    <button data-tab="place" aria-selected="false">位置</button>
    <button data-tab="tune" aria-selected="false">調整</button>
    <span class="flex"></span>
    <button class="save-all" id="saveAllBtn" disabled>全部儲存</button>
  </div>
  <div class="panelbody" id="panelbody"></div>
</div>

<div class="controls" id="controls">
  <div class="group show" data-group="style">
    <div class="chips" id="styleChips"></div>
    <div class="field fmtField">
      <label>輸出格式</label>
      <div class="seg" id="fmtSeg">
        <button data-fmt="png" aria-pressed="true">PNG 無損</button>
        <button data-fmt="jpeg" aria-pressed="false">JPEG 95</button>
        <button data-fmt="webp" aria-pressed="false">WebP 95</button>
      </div>
      <p class="hint" id="fmtHint">PNG 完全無損，但檔案大，10 張可能到數百 MB。</p>
    </div>
    <div class="field">
      <label>Logo 圖檔</label>
      <button class="btn" id="logoBtn">上傳 PNG</button>
      <input type="file" id="logoInput" accept="image/*" hidden>
      <p class="hint" id="logoMsg">建議去背 PNG</p>
    </div>
  </div>

  <div class="group" data-group="text">
    <div class="field">
      <label for="mainText">主標文字</label>
      <input type="text" id="mainText" value="@yourname">
    </div>
    <div class="field">
      <label for="subText">副標文字</label>
      <input type="text" id="subText" value="handcrafted · since 2026">
    </div>
  </div>

  <div class="group" data-group="place">
    <div class="row">
      <div class="field">
        <label>位置</label>
        <div class="grid9" id="grid9"></div>
      </div>
      <div class="field" style="flex:1">
        <label>色調</label>
        <div class="seg" id="toneSeg">
          <button data-tone="light" aria-pressed="true">淺色印</button>
          <button data-tone="dark" aria-pressed="false">深色印</button>
        </div>
      </div>
    </div>
  </div>

  <div class="group" data-group="tune">
    <div class="field">
      <label for="sizeR">尺寸</label>
      <div class="slider"><input type="range" id="sizeR" min="50" max="180" value="100"><span class="val" id="sizeV">100%</span></div>
    </div>
    <div class="field">
      <label for="alphaR">濃度</label>
      <div class="slider"><input type="range" id="alphaR" min="30" max="170" value="100"><span class="val" id="alphaV">100%</span></div>
    </div>
  </div>
</div>

<script>
"use strict";
var MONO='ui-monospace, Menlo, monospace';
var SANS='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", Helvetica, sans-serif';

var STYLES=[
  {id:'minimal', name:'極簡字標',   kind:'角落', note:'寬字距、細字重、低透明度。不搶畫面，適合本身就好看的商品照。'},
  {id:'scrim',   name:'底部漸層條', kind:'邊緣', note:'漸層遮罩壓住雜訊，字放上面。位置選上排會翻到頂端。'},
  {id:'pill',    name:'膠囊標籤',   kind:'角落', note:'圓角膠囊。存在感明確但乾淨，轉貼出去也認得出來源。'},
  {id:'logo',    name:'自訂 Logo',  kind:'角落', note:'上傳自己的 PNG 標誌，九宮格定位。'},
  {id:'diag',    name:'斜向暗紋',   kind:'滿版', note:'斜向重複平鋪，透明度壓低。最常見的防盜圖做法。'},
  {id:'grid',    name:'正交網格',   kind:'滿版', note:'不旋轉、隔行錯位。像正式文件的防偽底紋。'},
  {id:'outline', name:'中央大字',   kind:'滿版', note:'中間一個大字，只有外框線不填色。像樣張標記。'},
  {id:'dense',   name:'密集細字',   kind:'滿版', note:'字小、排密、透明度極低，像鈔票底紋。最難去除。'},
  {id:'edge',    name:'四邊環繞',   kind:'滿版', note:'文字沿四邊繞一圈，中間完全留空。商品看得最清楚。'}
];

var state={ main:'@yourname', sub:'handcrafted · since 2026', tone:'light',
            ax:0, ay:1, size:1, alpha:1, style:'minimal', fmt:'png' };
var items=[], logo=null, MAX=10;
var mq=window.matchMedia('(max-width: 860px)');
function isMobile(){ return mq.matches; }

function mimeFor(){ return state.fmt==='png'?'image/png':state.fmt==='jpeg'?'image/jpeg':'image/webp'; }
function extFor(){ return state.fmt==='png'?'png':state.fmt==='jpeg'?'jpg':'webp'; }
function qualFor(){ return state.fmt==='png'?undefined:0.95; }

/* ============ drawing helpers ============ */
function trackedWidth(ctx,text,tr){ var w=0,i; for(i=0;i<text.length;i++) w+=ctx.measureText(text[i]).width+tr; return w-tr; }
function drawTracked(ctx,text,x,y,tr,align){
  var total=trackedWidth(ctx,text,tr),i;
  var cx=align==='center'?x-total/2:align==='right'?x-total:x;
  for(i=0;i<text.length;i++){ ctx.fillText(text[i],cx,y); cx+=ctx.measureText(text[i]).width+tr; }
  return total;
}
function strokeTracked(ctx,text,x,y,tr,align){
  var total=trackedWidth(ctx,text,tr),i;
  var cx=align==='center'?x-total/2:align==='right'?x-total:x;
  for(i=0;i<text.length;i++){ ctx.strokeText(text[i],cx,y); cx+=ctx.measureText(text[i]).width+tr; }
  return total;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function alignFor(ax){ return ax===0?'left':ax===1?'right':'center'; }
function place(W,H,m,ax,ay){ return { x:m+ax*(W-2*m), y:m+ay*(H-2*m) }; }
function inkColor(){ return state.tone==='light'?'#ffffff':'#15181f'; }
function haloOn(ctx,S){
  if(state.tone==='light'){ ctx.shadowColor='rgba(0,0,0,.42)'; ctx.shadowBlur=S*.012; ctx.shadowOffsetY=S*.002; }
  else { ctx.shadowColor='rgba(255,255,255,.5)'; ctx.shadowBlur=S*.014; ctx.shadowOffsetY=0; }
}
function haloOff(ctx){ ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0; }
function fmtBytes(n){
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}

function samplePhoto(ctx,w,h){
  var g=ctx.createLinearGradient(0,0,w*.4,h);
  g.addColorStop(0,'#f6efe6'); g.addColorStop(.55,'#efe2d8'); g.addColorStop(1,'#e3d0cb');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.filter='blur(26px)'; ctx.fillStyle='rgba(180,145,150,.42)';
  ctx.beginPath(); ctx.ellipse(w*.5,h*.72,w*.30,h*.055,0,0,7); ctx.fill(); ctx.restore();
  var b=ctx.createRadialGradient(w*.40,h*.40,w*.04,w*.5,h*.5,w*.42);
  b.addColorStop(0,'#f2c9c0'); b.addColorStop(.6,'#dfa89f'); b.addColorStop(1,'#c98b84');
  ctx.fillStyle=b;
  ctx.beginPath(); ctx.ellipse(w*.5,h*.5,w*.27,h*.24,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w*.33,h*.36,w*.075,h*.062,-.4,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w*.67,h*.36,w*.075,h*.062,.4,0,7); ctx.fill();
  ctx.save(); ctx.filter='blur(16px)'; ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(w*.41,h*.44,w*.09,h*.05,-.5,0,7); ctx.fill(); ctx.restore();
}
function paintSource(ctx,src,W,H){
  if(!src){ samplePhoto(ctx,W,H); return; }
  var r=Math.max(W/src.w,H/src.h), dw=src.w*r, dh=src.h*r;
  try{ ctx.drawImage(src.el,(W-dw)/2,(H-dh)/2,dw,dh); }
  catch(e){ samplePhoto(ctx,W,H); }
}

var tileCache={};
function tilePattern(ctx,cfg){
  var key=[cfg.tag,state.main,state.tone,cfg.fs.toFixed(2),cfg.padX.toFixed(2),cfg.stepY.toFixed(2)].join('|');
  if(tileCache[key]) return ctx.createPattern(tileCache[key],'repeat');
  var probe=document.createElement('canvas').getContext('2d');
  probe.font='500 '+cfg.fs+'px '+MONO;
  var tr=cfg.fs*cfg.trk, tw=trackedWidth(probe,state.main,tr);
  var stepX=Math.max(4,tw+cfg.padX), stepY=Math.max(4,cfg.stepY);
  var c=document.createElement('canvas');
  c.width=Math.ceil(stepX); c.height=Math.ceil(stepY*2);
  var t=c.getContext('2d');
  t.font='500 '+cfg.fs+'px '+MONO;
  t.fillStyle=state.tone==='light'?'#ffffff':'#000000';
  t.textBaseline='middle'; t.textAlign='left';
  drawTracked(t,state.main,0,stepY*.5,tr);
  drawTracked(t,state.main,-stepX/2,stepY*1.5,tr);
  drawTracked(t,state.main,stepX/2,stepY*1.5,tr);
  tileCache[key]=c;
  return ctx.createPattern(c,'repeat');
}
function fillTiles(ctx,W,H,cfg,deg,alpha){
  var pat=tilePattern(ctx,cfg); if(!pat) return;
  var R=Math.hypot(W,H);
  ctx.save();
  ctx.globalAlpha=Math.min(1,alpha*state.alpha);
  ctx.translate(W/2,H/2); ctx.rotate(deg*Math.PI/180);
  ctx.fillStyle=pat; ctx.fillRect(-R,-R,R*2,R*2);
  ctx.restore();
}

var DRAW={
  minimal:function(ctx,W,H){
    var S=Math.min(W,H), z=state.size, m=S*.062;
    var f1=S*.030*z, f2=S*.017*z, gap=f1*.44, blockH=f1+gap+f2;
    var p=place(W,H,m,state.ax,state.ay);
    var top=state.ay===0?p.y:state.ay===1?p.y-blockH:p.y-blockH/2;
    var al=alignFor(state.ax);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle=inkColor(); haloOn(ctx,S);
    ctx.globalAlpha=Math.min(1,.88*state.alpha);
    ctx.font='300 '+f1+'px '+SANS;
    drawTracked(ctx,state.main,p.x,top+f1,f1*.34,al);
    ctx.globalAlpha=Math.min(1,.62*state.alpha);
    ctx.font='400 '+f2+'px '+MONO;
    drawTracked(ctx,state.sub,p.x,top+f1+gap+f2,f2*.22,al);
    ctx.globalAlpha=1; haloOff(ctx);
  },
  scrim:function(ctx,W,H){
    var S=Math.min(W,H), z=state.size, m=S*.062;
    var topSide=state.ay===0, bandH=H*(.24+.10*z);
    var g=topSide?ctx.createLinearGradient(0,bandH,0,0):ctx.createLinearGradient(0,H-bandH,0,H);
    var lm=state.tone==='light';
    if(lm){
      g.addColorStop(0,'rgba(8,10,14,0)');
      g.addColorStop(.55,'rgba(8,10,14,'+Math.min(.6,.34*state.alpha)+')');
      g.addColorStop(1,'rgba(8,10,14,'+Math.min(.92,.72*state.alpha)+')');
    } else {
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(.55,'rgba(255,255,255,'+Math.min(.7,.40*state.alpha)+')');
      g.addColorStop(1,'rgba(255,255,255,'+Math.min(.95,.82*state.alpha)+')');
    }
    ctx.fillStyle=g; ctx.fillRect(0,topSide?0:H-bandH,W,bandH);
    var f1=S*.040*z, f2=S*.016*z, al=alignFor(state.ax);
    var px=m+state.ax*(W-2*m), baseY=topSide?m+f1+f2*2.2:H-m;
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle=lm?'rgba(255,255,255,.66)':'rgba(21,24,31,.62)';
    ctx.font='500 '+f2+'px '+MONO;
    drawTracked(ctx,state.sub.toUpperCase(),px,baseY-f1*1.32,f2*.32,al);
    ctx.fillStyle=lm?'#ffffff':'#15181f';
    ctx.font='600 '+f1+'px '+SANS;
    drawTracked(ctx,state.main,px,baseY,f1*.02,al);
    ctx.strokeStyle=lm?'rgba(255,255,255,.34)':'rgba(21,24,31,.30)';
    ctx.lineWidth=Math.max(1,S*.0022);
    var lx=state.ax===1?px-S*.10:state.ax===.5?px-S*.05:px;
    ctx.beginPath(); ctx.moveTo(lx,baseY-f1*1.95); ctx.lineTo(lx+S*.10,baseY-f1*1.95); ctx.stroke();
  },
  pill:function(ctx,W,H){
    var S=Math.min(W,H), z=state.size, m=S*.052, fs=S*.026*z, tr=fs*.10;
    ctx.font='600 '+fs+'px '+SANS;
    var tw=trackedWidth(ctx,state.main,tr);
    var dot=fs*.34, gap=fs*.62, padX=fs*.92, h=fs*2.5, w=padX*2+dot+gap+tw;
    var p=place(W,H,m,state.ax,state.ay);
    var x=p.x-state.ax*w, y=p.y-state.ay*h;
    ctx.save();
    ctx.globalAlpha=Math.min(1,state.alpha);
    ctx.shadowColor='rgba(0,0,0,.26)'; ctx.shadowBlur=S*.020; ctx.shadowOffsetY=S*.004;
    roundRect(ctx,x,y,w,h,h/2);
    if(state.tone==='light'){ ctx.fillStyle='rgba(255,255,255,.94)'; ctx.fill(); }
    else{
      ctx.fillStyle='rgba(18,20,26,.62)'; ctx.fill(); haloOff(ctx);
      ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=Math.max(1,S*.002); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.globalAlpha=Math.min(1,state.alpha);
    ctx.fillStyle='#2383e2';
    ctx.beginPath(); ctx.arc(x+padX+dot/2,y+h/2,dot/2,0,7); ctx.fill();
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillStyle=state.tone==='light'?'#15181f':'#ffffff';
    drawTracked(ctx,state.main,x+padX+dot+gap,y+h/2+fs*.04,tr);
    ctx.restore();
    ctx.textBaseline='alphabetic';
  },
  logo:function(ctx,W,H){
    var S=Math.min(W,H), z=state.size, m=S*.058;
    if(logo){
      var lw=W*.22*z, lh=lw*(logo.h/logo.w);
      var p=place(W,H,m,state.ax,state.ay);
      ctx.save();
      ctx.globalAlpha=Math.min(1,.92*state.alpha);
      ctx.shadowColor='rgba(0,0,0,.30)'; ctx.shadowBlur=S*.016; ctx.shadowOffsetY=S*.003;
      ctx.drawImage(logo.el,p.x-state.ax*lw,p.y-state.ay*lh,lw,lh);
      ctx.restore();
    } else {
      var r=S*.072*z, p2=place(W,H,m,state.ax,state.ay);
      var cx=p2.x-state.ax*r*2+r, cy=p2.y-state.ay*r*2+r;
      ctx.save();
      ctx.globalAlpha=Math.min(1,state.alpha);
      ctx.shadowColor='rgba(0,0,0,.24)'; ctx.shadowBlur=S*.018; ctx.shadowOffsetY=S*.004;
      roundRect(ctx,cx-r,cy-r,r*2,r*2,r*.42);
      ctx.fillStyle=state.tone==='light'?'rgba(255,255,255,.92)':'rgba(18,20,26,.66)';
      ctx.fill(); ctx.restore();
      var initial=(state.main.replace(/[@\s]/g,'')[0]||'W').toUpperCase();
      ctx.save();
      ctx.globalAlpha=Math.min(1,state.alpha);
      ctx.fillStyle=state.tone==='light'?'#15181f':'#ffffff';
      ctx.font='600 '+(r*1.05)+'px '+MONO;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(initial,cx,cy+r*.04);
      ctx.restore();
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
  },
  diag:function(ctx,W,H){ var S=Math.min(W,H),z=state.size;
    fillTiles(ctx,W,H,{tag:'diag',fs:S*.024*z,trk:.16,padX:S*.13*z,stepY:S*.115*z},-28,.16); },
  grid:function(ctx,W,H){ var S=Math.min(W,H),z=state.size;
    fillTiles(ctx,W,H,{tag:'grid',fs:S*.020*z,trk:.20,padX:S*.10*z,stepY:S*.078*z},0,.15); },
  dense:function(ctx,W,H){ var S=Math.min(W,H),z=state.size;
    fillTiles(ctx,W,H,{tag:'dense',fs:S*.011*z,trk:.12,padX:S*.034*z,stepY:S*.030*z},-12,.14); },
  outline:function(ctx,W,H){
    var S=Math.min(W,H), z=state.size;
    var txt=(state.main||'').replace(/^@/,'').toUpperCase();
    if(!txt.trim()) return;
    var fs=S*.10,tr;
    ctx.font='700 '+fs+'px '+SANS; tr=fs*.08;
    var cur=trackedWidth(ctx,txt,tr);
    if(cur>0) fs=fs*(W*.84*z/cur);
    fs=Math.min(fs,H*.42);
    ctx.font='700 '+fs+'px '+SANS; tr=fs*.08;
    var p=place(W,H,S*.06,.5,state.ay);
    var cy=state.ay===0?p.y+fs*.5:state.ay===1?p.y-fs*.5:H/2;
    ctx.save();
    ctx.globalAlpha=Math.min(1,.42*state.alpha);
    ctx.strokeStyle=inkColor();
    ctx.lineWidth=Math.max(1,fs*.035); ctx.lineJoin='round';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    strokeTracked(ctx,txt,W/2,cy,tr,'center');
    ctx.restore();
    ctx.textBaseline='alphabetic';
  },
  edge:function(ctx,W,H){
    var S=Math.min(W,H), z=state.size;
    var fs=S*.017*z, tr=fs*.30, m=S*.040;
    ctx.font='500 '+fs+'px '+MONO;
    var unit=state.main+'   ·   ';
    function fill(len){
      var one=trackedWidth(ctx,unit,tr);
      if(one<=0) return state.main;
      var n=Math.ceil(len/one)+1,s='',i;
      for(i=0;i<n;i++) s+=unit;
      return s;
    }
    ctx.save();
    ctx.globalAlpha=Math.min(1,.55*state.alpha);
    ctx.fillStyle=inkColor(); haloOn(ctx,S);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    var wLen=W-m*2, hLen=H-m*2;
    ctx.save(); ctx.beginPath(); ctx.rect(m,0,wLen,H); ctx.clip();
    drawTracked(ctx,fill(wLen),m,m,tr); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(m,0,wLen,H); ctx.clip();
    ctx.translate(W-m,H-m); ctx.rotate(Math.PI);
    drawTracked(ctx,fill(wLen),0,0,tr); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(0,m,W,hLen); ctx.clip();
    ctx.translate(W-m,m); ctx.rotate(Math.PI/2);
    drawTracked(ctx,fill(hLen),0,0,tr); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(0,m,W,hLen); ctx.clip();
    ctx.translate(m,H-m); ctx.rotate(-Math.PI/2);
    drawTracked(ctx,fill(hLen),0,0,tr); ctx.restore();
    ctx.restore();
    ctx.textBaseline='alphabetic';
  }
};

function render(ctx,src,W,H,styleId){
  ctx.clearRect(0,0,W,H);
  ctx.save(); paintSource(ctx,src,W,H); ctx.restore();
  ctx.save(); DRAW[styleId](ctx,W,H); ctx.restore();
}

/* ============ style pickers ============ */
function styleName(id){ var i; for(i=0;i<STYLES.length;i++) if(STYLES[i].id===id) return STYLES[i].name; return ''; }
var styleGrid=document.getElementById('styleGrid');
var styleChips=document.getElementById('styleChips');

STYLES.forEach(function(s){
  var card=document.createElement('article');
  card.className='card'+(s.id===state.style?' active':'');
  card.dataset.style=s.id;
  card.innerHTML=
    '<div class="stage"><canvas id="pv-'+s.id+'"></canvas><div class="check">✓</div></div>'+
    '<div class="meta"><div class="mrow"><span class="name">'+s.name+'</span>'+
    '<span class="tag">'+s.kind+'</span></div><p class="note">'+s.note+'</p></div>';
  card.addEventListener('click',function(){ setStyle(s.id); });
  styleGrid.appendChild(card);

  var chip=document.createElement('button');
  chip.className='chip';
  chip.dataset.style=s.id;
  chip.textContent=s.name;
  chip.setAttribute('aria-pressed',String(s.id===state.style));
  chip.addEventListener('click',function(){ setStyle(s.id); });
  styleChips.appendChild(chip);
});
function setStyle(id){
  state.style=id;
  Array.prototype.forEach.call(styleGrid.children,function(c){ c.classList.toggle('active',c.dataset.style===id); });
  Array.prototype.forEach.call(styleChips.children,function(c){
    if(c.dataset.style) c.setAttribute('aria-pressed',String(c.dataset.style===id));
  });
  scheduleRender();
}

/* ============ batch ============ */
var batchGrid=document.getElementById('batchGrid');
var visible={}, dirty={};
var io=('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    var idx=e.target.dataset.idx;
    visible[idx]=e.isIntersecting;
    if(e.isIntersecting && dirty[idx]) renderItem(parseInt(idx,10));
  });
},{rootMargin:'320px 0px'}) : null;

function buildBatch(){
  batchGrid.innerHTML='';
  visible={}; dirty={};
  items.forEach(function(it,idx){
    var el=document.createElement('div');
    el.className='item';
    el.dataset.idx=idx;
    el.innerHTML=
      '<div class="stage"><canvas id="bt-'+idx+'"></canvas>'+(it.kind==='video'?'<span class="vtag">影片單格</span>':'')+'</div>'+
      '<div class="idesc"><div class="iname" title="'+it.name+'">'+it.name+'</div>'+
      '<div class="idim">'+it.w+'×'+it.h+' → <em>'+it.w+'×'+it.h+'</em></div></div>'+
      '<div class="ibar">'+
      '<button class="mini save" data-sv="'+idx+'">儲存</button>'+
      '<button class="mini" data-cp="'+idx+'">複製</button>'+
      '<button class="mini" data-dl="'+idx+'">下載</button>'+
      '<button class="mini x" data-rm="'+idx+'">✕</button></div>';
    batchGrid.appendChild(el);
    visible[idx]=true;
    if(io) io.observe(el);
  });
  document.getElementById('count').textContent=items.length;
  document.getElementById('zipBtn').disabled=items.length===0;
  document.getElementById('saveAllBtn').disabled=items.length===0;
  document.getElementById('drop').style.display = items.length>=MAX ? 'none' : '';
  updateHint();
}
function updateHint(){
  document.getElementById('batchHint').textContent = items.length
    ? '正在套用「'+styleName(state.style)+'」，輸出保留原始尺寸'
    : '最多 10 張，輸出保留原始尺寸';
}
batchGrid.addEventListener('click',function(e){
  var dl=e.target.closest('[data-dl]'), rm=e.target.closest('[data-rm]'),
      cp=e.target.closest('[data-cp]'), sv=e.target.closest('[data-sv]');
  if(sv) saveToPhotos(parseInt(sv.dataset.sv,10),sv);
  if(dl) exportOne(parseInt(dl.dataset.dl,10));
  if(cp) copyOne(parseInt(cp.dataset.cp,10),cp);
  if(rm){ items.splice(parseInt(rm.dataset.rm,10),1); buildBatch(); scheduleRender(); }
});

function fitBox(src,maxSide){
  var ar=src?src.w/src.h:0.8;
  if(ar>=1) return { w:Math.round(maxSide), h:Math.round(maxSide/ar) };
  return { w:Math.round(maxSide*ar), h:Math.round(maxSide) };
}
function itemMaxSide(){
  if(!isMobile()) return 300;
  return Math.min(720, Math.round(window.innerWidth*1.4));
}
function renderItem(idx){
  var it=items[idx]; if(!it) return;
  var cv=document.getElementById('bt-'+idx); if(!cv) return;
  var b=fitBox(it,itemMaxSide());
  if(cv.width!==b.w||cv.height!==b.h){ cv.width=b.w; cv.height=b.h; }
  render(cv.getContext('2d'),it,b.w,b.h,state.style);
  dirty[idx]=false;
}
var rafId=null;
function scheduleRender(){
  if(rafId) return;
  rafId=requestAnimationFrame(function(){ rafId=null; renderAll(); });
}
function renderAll(){
  if(!isMobile()){
    var src=items.length?items[0]:null;
    var box=fitBox(src,420);
    STYLES.forEach(function(s){
      var cv=document.getElementById('pv-'+s.id); if(!cv) return;
      if(cv.width!==box.w||cv.height!==box.h){ cv.width=box.w; cv.height=box.h; }
      render(cv.getContext('2d'),src,box.w,box.h,s.id);
    });
  }
  items.forEach(function(it,idx){
    if(isMobile() && io && visible[idx]===false){ dirty[idx]=true; return; }
    renderItem(idx);
  });
  updateHint();
}

/* ============ export ============ */
function exportCanvas(it){
  var cv=document.createElement('canvas');
  cv.width=it.w; cv.height=it.h;              // 1:1，不縮放
  render(cv.getContext('2d'),it,it.w,it.h,state.style);
  return cv;
}
function baseName(it,idx){
  var base=(it.name||'image').replace(/\.[^.]+$/,'').replace(/[\/\\:*?"<>|]/g,'_');
  return String(idx+1).padStart(2,'0')+'-'+base+'-'+state.style;
}
function safeName(it,idx){ return baseName(it,idx)+'.'+extFor(); }
function canvasBlob(cv,mime,q){
  mime=mime||mimeFor(); q=(q===undefined)?qualFor():q;
  return new Promise(function(res){
    if(cv.toBlob) cv.toBlob(function(b){ res(b); },mime,q);
    else{
      var url=q===undefined?cv.toDataURL(mime):cv.toDataURL(mime,q);
      var bin=atob(url.split(',')[1]), u=new Uint8Array(bin.length),i;
      for(i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      res(new Blob([u],{type:mime}));
    }
  });
}
function isEmbedded(){ try{ return window.self!==window.top; }catch(e){ return true; } }

var saveModal=document.getElementById('saveModal');
function openSave(url,filename){
  document.getElementById('saveImg').src=url;
  var link=document.getElementById('saveLink');
  link.href=url; link.download=filename;
  saveModal.classList.add('open');
}
function closeSave(){ saveModal.classList.remove('open'); document.getElementById('saveImg').removeAttribute('src'); }
document.getElementById('saveClose').addEventListener('click',closeSave);
saveModal.addEventListener('click',function(e){ if(e.target===saveModal) closeSave(); });

function flash(btn,text,ok){
  if(!btn) return;
  var old=btn.dataset.label||btn.textContent;
  btn.dataset.label=old;
  btn.textContent=text;
  btn.classList.toggle('ok',!!ok);
  setTimeout(function(){ btn.textContent=btn.dataset.label; btn.classList.remove('ok'); },1700);
}

/* 存到相簿：走系統分享面板，iOS 會出現「儲存影像」 */
async function saveToPhotos(idx,btn){
  var it=items[idx]; if(!it) return;
  flash(btn,'處理中…');
  try{
    var blob=await canvasBlob(exportCanvas(it),'image/png',undefined);
    var file=new File([blob],baseName(it,idx)+'.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
      return;
    }
    throw new Error('no-share');
  }catch(err){
    if(err && err.name==='AbortError') return;
    var b2=await canvasBlob(exportCanvas(it),'image/png',undefined);
    openSave(URL.createObjectURL(b2),baseName(it,idx)+'.png');
  }
}
document.getElementById('saveAllBtn').addEventListener('click',async function(){
  if(!items.length) return;
  var btn=this;
  btn.disabled=true;
  var old=btn.textContent;
  try{
    var files=[],i;
    for(i=0;i<items.length;i++){
      btn.textContent=(i+1)+'/'+items.length;
      await new Promise(function(r){ setTimeout(r,0); });
      // 多張一起分享用 JPEG，全 PNG 原尺寸容易讓手機瀏覽器記憶體不足
      var blob=await canvasBlob(exportCanvas(items[i]),'image/jpeg',0.95);
      files.push(new File([blob],baseName(items[i],i)+'.jpg',{type:'image/jpeg'}));
    }
    if(navigator.canShare && navigator.canShare({files:files})){
      await navigator.share({files:files});
    } else {
      btn.textContent='此裝置不支援';
      setTimeout(function(){ btn.textContent=old; },1800);
    }
  }catch(err){
    if(!err || err.name!=='AbortError'){
      btn.textContent='失敗，改用單張';
      setTimeout(function(){ btn.textContent=old; },2200);
    }
  }
  btn.textContent=old;
  btn.disabled=false;
});

async function exportOne(idx){
  var it=items[idx]; if(!it) return;
  var blob=await canvasBlob(exportCanvas(it));
  var url=URL.createObjectURL(blob), fn=safeName(it,idx);
  if(isEmbedded()){ openSave(url,fn); return; }
  var a=document.createElement('a');
  a.download=fn; a.href=url;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },8000);
}
function copyOne(idx,btn){
  var it=items[idx]; if(!it) return;
  if(!navigator.clipboard || !window.ClipboardItem){
    canvasBlob(exportCanvas(it),'image/png',undefined).then(function(b){ openSave(URL.createObjectURL(b),baseName(it,idx)+'.png'); });
    return;
  }
  var pending=new Promise(function(res){
    var cv=exportCanvas(it);
    if(cv.toBlob) cv.toBlob(function(b){ res(b); },'image/png');
    else res(new Blob());
  });
  var item=new ClipboardItem({'image/png':pending});
  navigator.clipboard.write([item]).then(function(){ flash(btn,'已複製',true); })
    .catch(function(){ pending.then(function(b){ openSave(URL.createObjectURL(b),baseName(it,idx)+'.png'); }); });
}

/* ---- store-only ZIP (desktop) ---- */
var CRC_T=(function(){
  var t=new Uint32Array(256),c,n,k;
  for(n=0;n<256;n++){ c=n; for(k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t;
})();
function crc32(buf){
  var c=0xFFFFFFFF,i;
  for(i=0;i<buf.length;i++) c=CRC_T[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  var enc=new TextEncoder(),parts=[],central=[],offset=0,i;
  for(i=0;i<files.length;i++){
    var nameB=enc.encode(files[i].name), data=files[i].data, crc=crc32(data);
    var lh=new Uint8Array(30+nameB.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true);
    lh.set(nameB,30); parts.push(lh,data);
    var ch=new Uint8Array(46+nameB.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameB.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    ch.set(nameB,46); central.push(ch);
    offset+=lh.length+data.length;
  }
  var cenSize=0,j;
  for(j=0;j<central.length;j++) cenSize+=central[j].length;
  var eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSize,true); ev.setUint32(16,offset,true); ev.setUint16(20,0,true);
  return new Blob(parts.concat(central,[eo]),{type:'application/zip'});
}
var zipBtn=document.getElementById('zipBtn');
zipBtn.addEventListener('click',async function(){
  if(!items.length) return;
  zipBtn.disabled=true;
  var files=[],total=0,i;
  try{
    for(i=0;i<items.length;i++){
      zipBtn.textContent='打包中 '+(i+1)+'/'+items.length;
      await new Promise(function(r){ setTimeout(r,0); });
      var blob=await canvasBlob(exportCanvas(items[i]));
      var bytes=new Uint8Array(await blob.arrayBuffer());
      total+=bytes.length;
      files.push({name:safeName(items[i],i),data:bytes});
    }
    var url=URL.createObjectURL(zipStore(files));
    var a=document.createElement('a');
    a.download='watermarked-'+state.style+'.zip'; a.href=url;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },8000);
    zipBtn.textContent=isEmbedded()?'若沒反應請另開':'完成 '+fmtBytes(total);
  }catch(err){ zipBtn.textContent='打包失敗，記憶體可能不足'; }
  setTimeout(function(){ zipBtn.textContent='打包下載 ZIP'; },2600);
  zipBtn.disabled=false;
});

/* ============ loading ============ */
function readAsDataURL(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(r.result); };
    r.onerror=function(){ rej(new Error('read')); };
    r.readAsDataURL(file);
  });
}
function loadImage(url){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){ res({el:img,w:img.naturalWidth,h:img.naturalHeight,kind:'image'}); };
    img.onerror=function(){ rej(new Error('decode')); };
    img.src=url;
  });
}
function loadVideoFrame(url){
  return new Promise(function(res,rej){
    var v=document.createElement('video');
    v.muted=true; v.defaultMuted=true; v.playsInline=true;
    v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    v.preload='auto';
    var settled=false;
    function finish(){
      if(settled||!v.videoWidth) return;
      settled=true; try{ v.pause(); }catch(e){}
      res({el:v,w:v.videoWidth,h:v.videoHeight,kind:'video'});
    }
    v.addEventListener('loadeddata',function(){
      try{ v.currentTime=Math.min(1.2,(v.duration||2)/2); }catch(e){ finish(); }
    });
    v.addEventListener('seeked',finish);
    v.addEventListener('error',function(){ if(!settled){ settled=true; rej(new Error('video')); } });
    setTimeout(function(){
      if(settled) return;
      var p=v.play();
      if(p&&p.then) p.then(function(){ setTimeout(finish,350); }).catch(function(){});
    },900);
    setTimeout(function(){ if(!settled){ settled=true; rej(new Error('timeout')); } },9000);
    v.src=url; v.load();
  });
}
async function loadAny(file){
  var isVideo=(file.type||'').indexOf('video')===0||/\.(mp4|mov|m4v|webm)$/i.test(file.name);
  var loader=isVideo?loadVideoFrame:loadImage;
  var burl=URL.createObjectURL(file);
  try{ return await loader(burl); }
  catch(e){ URL.revokeObjectURL(burl); return await loader(await readAsDataURL(file)); }
}

var dropSub=document.getElementById('dropSub');
var DEFAULT_SUB='JPG · PNG · WebP，影片可取單格';
async function addFiles(fileArray){
  var files=fileArray.slice();
  if(!files.length){ dropSub.textContent='沒有讀到檔案，再選一次看看'; return; }
  var room=MAX-items.length;
  if(room<=0){ dropSub.textContent='已經滿 10 張了，先移掉幾張再加'; return; }
  var over=files.length>room;
  files=files.slice(0,room);
  var failed=0,i;
  for(i=0;i<files.length;i++){
    dropSub.textContent='讀取中… '+(i+1)+'/'+files.length;
    try{
      var m=await loadAny(files[i]);
      m.name=files[i].name;
      items.push(m);
      buildBatch(); scheduleRender();
    }catch(e){ failed++; }
  }
  dropSub.textContent = failed
    ? failed+' 個檔案解不開（iPhone 的 HEIC 請改成「最相容」，或另存 JPG）'
    : over ? '已加到上限 10 張，其餘略過' : DEFAULT_SUB;
}

});

/* ============ layout switching ============ */
var controls=document.getElementById('controls');
function placeControls(){
  if(isMobile()) document.getElementById('panelbody').appendChild(controls);
  else document.getElementById('panel').appendChild(controls);
}
function showGroup(name){
  Array.prototype.forEach.call(controls.children,function(g){ g.classList.toggle('show', g.dataset.group===name); });
  Array.prototype.forEach.call(document.getElementById('tabs').children,function(b){
    if(b.dataset.tab) b.setAttribute('aria-selected',String(b.dataset.tab===name));
  });
}
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]'); if(!b) return;
  showGroup(b.dataset.tab);
});
function applyLayout(){
  placeControls();
  if(isMobile()) showGroup(document.querySelector('#tabs [aria-selected=true]').dataset.tab || 'style');
  else Array.prototype.forEach.call(controls.children,function(g){ g.classList.add('show'); });
  scheduleRender();
}
